[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         tail
    Path         /var/log/apache2/veltrix-access.json
    Parser       json
    Tag          apache.access

[FILTER]
    Name         modify
    Match        apache.access
    Add          orgId ${VELTRIX_ORG_ID}
    Add          sourceSystem collector:apache
    Add          category NETWORK
    Add          severity LOW
    Add          eventType web.request.normal

[OUTPUT]
    Name         http
    Match        apache.access
    Host         api.veltrix.io
    Port         443
    URI          /api/v1/events
    Format       json
    Header       Content-Type application/json
    Header       x-organization-id ${VELTRIX_ORG_ID}
    Header       x-api-key ${VELTRIX_API_KEY}
    Tls          On
