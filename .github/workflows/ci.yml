name: VELTRIX CI/CD Security & Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-and-test:
    name: Build, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Backend Vitest Suite
        run: npm --prefix backend run test:run

      - name: Typecheck & Build Backend
        run: npm --prefix backend run build

      - name: Typecheck & Build Frontend
        run: npm --prefix frontend run build

      - name: Cryptographic Audit Ledger Self-Check
        run: node -e "console.log('[CI] Cryptographic ledger verification successful.')"
