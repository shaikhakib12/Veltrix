name: VELTRIX CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build --workspace=@veltrix/shared

      - name: Typecheck Workspaces
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

      - name: Run Test Suites
        run: npm run test

      - name: Build All Packages
        run: npm run build

      - name: Verify Production Artifact Exclusion
        run: |
          test_files=$(find backend/dist -type f \( -iname "*test*" -o -iname "*.spec.*" \))
          if [ -n "$test_files" ]; then
            echo "::error::Test artifacts detected in production build backend/dist:"
            echo "$test_files"
            exit 1
          fi
          echo "Production artifact exclusion verified: 0 test files in backend/dist."
